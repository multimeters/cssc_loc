# 唯一运行主配置。相对路径以本文件所在目录为基准。
# 外参 xyz_m 使用米，rpy_deg 使用度；初值 rpy_rad 使用弧度。
# RPY 采用 ROS 固定轴顺序：Rz(yaw) * Ry(pitch) * Rx(roll)。
schema_version: 1
paths:
  bag: /home/user/bags/hunter_sensors_20260930_104649
  # 室外 outdoor0920；室内改 GlobalMap_loc.pcd
  map: /home/user/ws_nav_fastlio/src/octomap_convert/map_handle/outdoor0920/outdoor0920_reloc_level.pcd
  map_metadata: null
  output_root: ../artifacts/fusion
runtime:
  # 默认订阅实车 ROS 话题；回放命令生成 mode=replay/use_sim_time=true 的运行快照。
  mode: live
  use_sim_time: false
live:
  # 与本机 Hunter 导航栈一致
  domain_id: 42
  localhost_only: false
  # topic：等待 /initialpose 中地图坐标系下的后轮中心初值；不自动采用旧 bag 初值。
  # config：明确选择 initial_pose 中保存的地图→雷达初值。
  initialization: topic
  max_sensor_age_s: 0.5
  # 实时缺少运动覆盖时，最多等到扫描结束后 0.1 秒便明确发布未补偿整帧。
  # 不放宽 IMU/轮速采样间隔或时间戳鲜度；回放仍使用 livox.wait_timeout_s。
  motion_wait_timeout_s: 0.1
  # 长时间没有有效 NDT 结果时暂停 NDT；新点云到达后唤醒并清空旧先验缓存。
  # 使用单调墙钟计时；持续坏点云也会按此间隔重置，防止上游先验无限积累。
  ndt_idle_timeout_s: 5.0
  future_tolerance_s: 0.1
  initial_pose_ack_position_m: 0.05
  initial_pose_ack_angle_rad: 0.05
  status_period_s: 2.0
  log_max_bytes: 10485760
  log_backup_count: 3
replay:
  rate: 0.5
  domain_id: 58
  localhost_only: true
  warmup_seconds: 3.0
  tail_seconds: 0.6
  max_bag_seconds: null
  ready_timeout: 90.0
  drain_seconds: 1.0
frames:
  map: map
  rear: base_footprint
  base: base_link  # 原生 EKF 的约束：rear_to_base 必须为恒等变换。
  lidar: mid360_link
  cloud: body
  imu: livox_frame
  wheel: hunter_base_link
  ndt_debug: ndt_base_link
topics:
  wheel: /hunter_odom
  imu: /livox/imu
  points: /livox/lidar
  processed_points: /localization/pointcloud/deskewed
  preprocessing_status: /localization/livox/status
  wheel_twist: /localization/input/wheel_twist
  imu_base: /localization/input/imu
  ndt_points: /localization/ndt/input_points
  initial_pose: /localization/initialpose
  initial_pose_input: /initialpose
  odometry: /localization/kinematic_state
  pose: /localization/pose_with_covariance
  ndt_pose: /localization/pose_estimator/pose_with_covariance
  ndt_pose_stamped: /localization/pose_estimator/pose
  ekf_prediction: /localization/pose_twist_fusion_filter/pose_with_covariance
  ekf_odometry: /localization/internal/ekf_odom
  gyro_twist: /localization/twist_estimator/twist_with_covariance
  fusion_status: /localization/fusion_status
  diagnostics: /diagnostics
  ekf_tf: /localization/internal/ekf_tf
  ndt_tf: /localization/internal/ndt_tf
  metrics_prefix: /localization/pose_estimator
  clock: /clock
services:
  initialize: /localization/initialize
  ekf_activation: /localization/ekf/trigger_node
  ndt_activation: /localization/ndt/trigger_node
  ndt_align: /localization/pose_estimator/ndt_align_srv
  map_loader: /map/get_differential_pointcloud_map
extrinsics:
  rear_to_base:
    xyz_m: [0.0, 0.0, 0.0]
    rpy_deg: [0.0, 0.0, 0.0]
    provenance: user_confirmed_rear_wheel_center_identity
  rear_to_lidar:
    # 后轮中心 → 雷达：+25.06895° 为授权试跑估计值，尚未实测标定。
    xyz_m: [0.432445, 0.0, 0.368458]
    rpy_deg: [0.0, 25.06895, 0.0]
    provenance: provisional_forward_tilt_from_static_gravity_user_authorized
    confirmed_for_replay: true
    calibration_verified: false
  lidar_to_cloud:
    xyz_m: [0.0, 0.0, 0.0]
    rpy_deg: [0.0, 0.0, 0.0]
    provenance: user_confirmed_body_equals_mid360_origin_and_axes
  lidar_to_imu:
    # 雷达 → 内置 IMU：官方定义三轴同向，只有原点偏移。
    xyz_m: [0.011, 0.02329, -0.04412]
    rpy_deg: [0.0, 0.0, 0.0]
    provenance: official_mid360_user_manual_2024_imu_axes_and_origin
    axes_confirmed: true
initial_pose:
  reference: cloud
  xyz_m: [3.569397, -2.387311, 0.471739]
  rpy_rad: [-0.017401, 0.357730, 0.111514]
  covariance_diagonal: [0.25, 0.25, 0.25, 0.04, 0.04, 0.04]
  provenance: first_scan_icp_map_to_body_seed_reports_new_bag_initial_registration
livox:
  # CustomMsg 的 livox_frame 点坐标使用雷达原点，不能套用内置 IMU 原点偏移。
  # 输出去畸变点云使用 frames.cloud（已确认与雷达原点/方向相同），时间戳为扫描结束。
  raw_frame: livox_frame
  min_range_m: 0.5
  max_range_m: 100.0
  max_scan_duration_s: 0.2
  max_imu_gap_s: 0.05
  max_wheel_gap_s: 0.1
  buffer_seconds: 2.0
  wait_timeout_s: 0.3
  reject_invalid_tags: true
  header_tolerance_s: 0.001
adapter:
  wheel_variance_floor: 0.0025
  angular_variance_floor: 0.0004
  sensor_timeout: 0.25
  ndt_timeout: 0.5
  prediction_timeout: 1.0
  future_tolerance: 0.1
  scan_wait_timeout: 1.0
  # 原生 NDT 的输入队列仅保留 1 帧；留出处理间隔，避免缺测等待后突发转发覆盖扫描。
  scan_relay_delay: 0.08
  voxel_size: 0.0
  max_pending_scans: 30
  publish_tf: true
  tick_period: 0.01
  status_period: 0.5
  sensor_queue_depth: 100
  cloud_queue_depth: 10
  output_queue_depth: 100
  initial_pose_queue_depth: 1
  status_queue_depth: 1
native_parameters:
  gyro: native/gyro.yaml
  ekf: native/ekf.yaml
  ndt: native/ndt.yaml
  map_loader: native/map_loader.yaml
# 仅用于输出完整性和覆盖检查；通过这些阈值不代表绝对定位精度已验证。
validation:
  scan_sample_stride: 100
  min_gyro_messages: 100
  min_ndt_acceptance_ratio: 0.9
  min_ekf_messages: 100
  max_pose_step_m: 2.0
  max_pose_gap_s: 1.0
  min_update_span_ratio: 0.8
