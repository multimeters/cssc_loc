/**:
  ros__parameters:
    use_sim_time: ${runtime.use_sim_time}
    enable_whole_load: false
    # 供 RViz 选取初值的显示地图；不改变 NDT 使用的差分地图。
    enable_downsampled_whole_load: true
    enable_partial_load: false
    enable_selected_load: false
    leaf_size: 1.0
    pcd_paths_or_directory: ["${paths.map}"]
    pcd_metadata_path: ${paths.map_metadata}
